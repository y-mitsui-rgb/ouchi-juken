<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#22456E" />
<title>おうち受験ラボ</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=Yusei+Magic&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#E9EEF5; --paper:#FFFFFF; --ink:#22262F; --ink2:#5C6572; --ink3:#8A93A1;
  --line:#D3DAE4; --line-soft:#E7ECF2;
  --navy:#22456E; --navy-d:#16304E; --navy-soft:#EDF3FA;
  --ok:#3C8A52; --ok-bg:#EFF8F1; --ng:#D24A32; --ng-bg:#FDF2EF;
  --gold:#B8862B;
  --kazu:#2E6CA8; --katachi:#3C8A52; --kotoba:#6B56A6; --kioku:#B8448A; --shikou:#C4801B; --joshiki:#A2542A;
  --shadow:3px 3px 0 rgba(34,38,47,.13);
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  background-image:linear-gradient(rgba(255,255,255,.72) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.72) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  line-height:1.75; font-size:16px;
}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--kazu);outline-offset:2px;border-radius:8px}

/* ---------- アプリ枠 ---------- */
.app{max-width:480px;margin:0 auto;padding:0 0 92px;position:relative;min-height:100vh;background:transparent}
@media(min-width:560px){ .app{box-shadow:0 0 0 1px var(--line),0 22px 50px rgba(21,30,45,.14);background:var(--bg);min-height:100vh} }

.appbar{
  position:sticky;top:0;z-index:20;background:rgba(233,238,245,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:10px 16px 9px;display:flex;align-items:center;gap:10px;
}
.appbar__back{
  width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:18px;line-height:1;
}
.appbar__back[hidden]{visibility:hidden}
.appbar h1{font-family:"Yusei Magic",sans-serif;font-size:17px;margin:0;flex:1 1 auto;letter-spacing:.02em}
.appbar h1 small{display:block;font-family:"Zen Kaku Gothic New",sans-serif;font-size:11.5px;color:var(--ink2);font-weight:500;letter-spacing:0}
.modebadge{
  font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;flex:0 0 auto;white-space:nowrap;
  background:var(--navy-soft);color:var(--navy);border:1px solid #CBD9EA;
}
.modebadge.honban{background:#FDF6E8;color:#8A6410;border-color:#EBD8AE}

.view{padding:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.card + .card{margin-top:14px}
.sec-title{font-family:"Yusei Magic",sans-serif;font-size:14.5px;margin:0 0 10px;color:var(--navy-d);letter-spacing:.02em}
.muted{color:var(--ink2);font-size:13px}
.tiny{font-size:12px;color:var(--ink3)}

/* ---------- ホーム ---------- */
.hero{background:linear-gradient(160deg,var(--navy) 0%,var(--navy-d) 100%);color:#fff;border:none;padding:20px}
.hero h2{font-family:"Yusei Magic",sans-serif;font-size:20px;margin:0 0 4px;letter-spacing:.02em}
.hero p{margin:0;font-size:13px;color:#C7D6E8}
.hero .row{display:flex;gap:14px;margin-top:16px}
.stat{flex:1;background:rgba(255,255,255,.1);border-radius:10px;padding:9px 11px}
.stat b{display:block;font-size:21px;font-family:"Yusei Magic",sans-serif;line-height:1.3}
.stat span{font-size:11.5px;color:#C7D6E8}
.btn{
  display:block;width:100%;border:none;border-radius:12px;padding:14px 16px;font-weight:700;
  background:var(--navy);color:#fff;box-shadow:var(--shadow);text-align:center;transition:transform .06s ease;
}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(34,38,47,.13)}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn.quiet{background:var(--navy-soft);color:var(--navy);box-shadow:none;border:1px solid #CBD9EA;font-weight:500}
.btn.small{padding:10px 12px;font-size:14px}
.btn:disabled{opacity:.45;box-shadow:none;cursor:default}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.cat{
  border:none;border-radius:12px;padding:13px 13px 11px;text-align:left;color:#fff;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:2px;transition:transform .06s ease;
}
.cat:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(34,38,47,.13)}
.cat b{font-family:"Yusei Magic",sans-serif;font-size:15.5px}
.cat span{font-size:11.5px;opacity:.92}

/* ---------- 出題 ---------- */
.progress{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.dots{display:flex;gap:6px;flex:1 1 auto}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dot.done{background:var(--ok)} .dot.now{background:var(--navy);transform:scale(1.35)}
.qhead{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.chip{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--navy-soft);color:var(--navy)}
.diff{font-size:11.5px;color:var(--ink2)}
.diff i{font-style:normal;color:var(--gold)}

/* よみあげカード（署名要素） */
.reader{
  background:linear-gradient(160deg,#1E3E63 0%,#16304E 100%);border-radius:var(--r);padding:14px;
  color:#fff;box-shadow:var(--shadow);display:flex;align-items:center;gap:13px;
}
.reader__play{
  width:54px;height:54px;border-radius:50%;flex:0 0 auto;border:2px solid rgba(255,255,255,.5);
  background:rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;justify-content:center;font-size:23px;
  transition:transform .08s ease;
}
.reader__play:active{transform:scale(.94)}
.reader__play[disabled]{opacity:.5;cursor:default}
.reader__body{flex:1 1 auto;min-width:0}
.reader__label{font-size:12px;color:#B9CCE2}
.reader__wave{display:flex;align-items:flex-end;gap:3px;height:26px;margin-top:3px}
.reader__wave i{display:block;width:4px;border-radius:2px;background:#8FB4D9;height:7px}
.reader.is-reading .reader__wave i{animation:wave .62s ease-in-out infinite;background:#fff}
.reader__wave i:nth-child(2){animation-delay:.09s}.reader__wave i:nth-child(3){animation-delay:.18s}
.reader__wave i:nth-child(4){animation-delay:.27s}.reader__wave i:nth-child(5){animation-delay:.36s}
.reader__wave i:nth-child(6){animation-delay:.45s}.reader__wave i:nth-child(7){animation-delay:.54s}
@keyframes wave{0%,100%{height:7px}50%{height:24px}}
.reader__state{font-size:13px;font-weight:700}
.reader__replay{
  flex:0 0 auto;border:1.5px solid rgba(255,255,255,.45);background:rgba(255,255,255,.14);color:#fff;
  border-radius:10px;padding:8px 12px;text-align:center;line-height:1.35;font-size:12.5px;font-weight:700;
}
.reader__replay small{display:block;font-size:10.5px;font-weight:500;opacity:.88}
.reader__replay[disabled]{opacity:.45;border-style:dashed;font-weight:500}

.stage{
  margin-top:14px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 12px;min-height:96px;display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
.stage__art svg{display:block}
.stage.is-hidden .stage__art{filter:blur(11px);opacity:.16}
.stage__cover{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;background:rgba(245,248,252,.93);text-align:center;padding:12px;
}
.countdown{font-family:"Yusei Magic",sans-serif;font-size:38px;color:var(--navy);line-height:1}
.prompt{margin-top:14px;font-size:16.5px;line-height:1.9}
.prompt.hidden-mode{color:var(--ink3);font-size:14px;font-style:normal}
.eyebrow{font-size:11.5px;font-weight:700;color:var(--ink3);letter-spacing:.08em;margin-bottom:5px}

.choices{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.choice{
  border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:14px 16px;text-align:left;
  display:flex;align-items:center;gap:12px;box-shadow:none;font-weight:500;transition:transform .06s ease;
}
.choice:active{transform:translate(2px,2px)}
.choice__mark{
  width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--ink2);
}
.choice.is-ok{border:3px solid var(--ok);background:#BFE6CC;box-shadow:0 0 0 3px rgba(60,138,82,.20)}
.choice.is-ok .choice__mark{background:var(--ok);border-color:var(--ok);color:#fff;font-size:15px}
.choice.is-ng{border:3px solid var(--ng);background:#F7CFC6}
.choice.is-ng .choice__mark{background:var(--ng);border-color:var(--ng);color:#fff;font-size:15px}
.choice:disabled{cursor:default;color:var(--ink);-webkit-text-fill-color:var(--ink);opacity:1}
.choice:disabled .choice__mark{opacity:1}

.choice__ans{display:inline-block;margin-left:8px;vertical-align:middle;background:var(--ok);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;letter-spacing:.04em}
.verdict{margin-top:14px;border-radius:var(--r);padding:14px}
.verdict.ok{background:#E7F5EC;border:2px solid var(--ok)}
.verdict.ng{background:#FBE6E0;border:2px solid var(--ng)}
.verdict__head{display:flex;align-items:center;gap:11px;margin-bottom:8px}
.verdict__badge{width:40px;height:40px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:700;line-height:1}
.verdict.ok .verdict__badge{background:var(--ok)} .verdict.ng .verdict__badge{background:var(--ng)}
.verdict.skip{background:#FBF6EA;border:2px solid var(--gold)}
.verdict.skip .verdict__badge{background:var(--gold)} .verdict.skip h3{color:#8A6410}
.verdict h3{font-family:"Yusei Magic",sans-serif;font-size:19px;margin:0}
.verdict.ok h3{color:#235B33} .verdict.ng h3{color:#93301D}
.verdict p{margin:0;font-size:14.5px}
.adultbox{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.adultbox summary{font-size:12.5px;color:var(--ink2);cursor:pointer;font-weight:700}
.adultbox p{font-size:13px;color:var(--ink2);margin-top:7px;line-height:1.8}

.done{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 16px 16px;background:linear-gradient(180deg,rgba(233,238,245,0),rgba(233,238,245,.96) 26%)}
.done .app{max-width:480px;margin:0 auto;padding:0}

/* ---------- 結果・記録 ---------- */
.score{display:flex;align-items:baseline;gap:8px;justify-content:center;margin:4px 0 12px}
.score b{font-family:"Yusei Magic",sans-serif;font-size:44px;color:var(--navy);line-height:1}
.score span{font-size:14px;color:var(--ink2)}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:74px 1fr 52px;align-items:center;gap:9px;font-size:13px}
.bar__t{font-weight:700}
.bar__track{display:block;height:11px;background:var(--line-soft);border-radius:6px;overflow:hidden}
.bar__fill{display:block;height:100%;border-radius:6px;min-width:2px}
.bar__v{text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums}
.hist{display:flex;flex-direction:column;gap:7px}
.hist__row{display:flex;align-items:center;gap:9px;font-size:13.5px;border-bottom:1px solid var(--line-soft);padding-bottom:7px}
.hist__row:last-child{border-bottom:none;padding-bottom:0}
.hist__dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.hist__v{margin-left:auto;font-weight:700}
.hist__v.ok{color:var(--ok)} .hist__v.ng{color:var(--ng)} .hist__v.skip{color:var(--gold)}
.empty{text-align:center;color:var(--ink2);font-size:14px;padding:22px 8px}

/* ---------- タブバー ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--paper);border-top:1px solid var(--line);
  display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.tabbar__inner{max-width:480px;margin:0 auto;display:flex;width:100%}
.tab{
  flex:1;border:none;background:none;padding:7px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;color:var(--ink3);font-weight:700;border-radius:10px;
}
.tab.on{color:var(--navy);background:var(--navy-soft)}
.tab svg{width:22px;height:22px}

/* ---------- モーダル ---------- */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(22,38,58,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet__box{background:#fff;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:480px}
@media(min-width:560px){ .sheet{align-items:center} .sheet__box{border-radius:18px} }
.sheet h3{font-family:"Yusei Magic",sans-serif;font-size:17px;margin:0 0 6px}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
.pinpad button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:13px;font-size:19px;font-weight:700}
.pinpad button.wide{grid-column:span 2}
.pindots{display:flex;gap:12px;justify-content:center;margin:14px 0 4px}
.pindots i{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--line);background:#fff}
.pindots i.on{background:var(--navy);border-color:var(--navy)}
.toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:70;background:var(--ink);color:#fff;
  padding:9px 16px;border-radius:999px;font-size:13.5px;opacity:0;transition:opacity .22s ease;pointer-events:none;max-width:88vw;text-align:center;
}
.toast.on{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* ---------- そだてる・先生・フォーム ---------- */
.kidbar{display:flex;align-items:center;gap:10px}
.kidbar__icon{width:42px;height:42px;border-radius:50%;background:var(--navy-soft);border:1px solid #CBD9EA;display:flex;align-items:center;justify-content:center;font-size:22px;flex:0 0 auto}
.ptsbadge{font-family:"Yusei Magic",sans-serif;font-size:19px;color:var(--gold);background:#FBF6EA;border:1px solid #EBD8AE;border-radius:999px;padding:4px 12px;flex:0 0 auto}
.ptsbadge small{font-size:11px;font-weight:700;margin-left:2px}
.charwrap{display:flex;gap:10px;align-items:center;margin-top:12px}
.charsvg{flex:0 0 auto;line-height:0}
.ptsrow{display:flex;justify-content:space-between;align-items:center;font-size:13px;border-bottom:1px dashed var(--line-soft);padding:5px 0}
.ptsrow b{font-family:"Yusei Magic",sans-serif}
.sensei{display:flex;gap:9px;align-items:flex-start;margin-top:12px}
.sensei__svg{flex:0 0 auto;line-height:0}
.bubble{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13.5px;line-height:1.7;flex:1 1 auto}
.bubble:before{content:"";position:absolute;left:-7px;top:15px;width:11px;height:11px;background:#fff;border-left:1.5px solid var(--line);border-bottom:1.5px solid var(--line);transform:rotate(45deg)}
.btn.big{padding:18px 16px;font-size:18px;font-family:"Yusei Magic",sans-serif;letter-spacing:.02em}
.growbars{display:flex;flex-direction:column;gap:9px}
.growrow{display:grid;grid-template-columns:78px 1fr 58px;align-items:center;gap:9px;font-size:13px}
.kidchips{display:flex;flex-wrap:wrap;gap:8px}
.kidchip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-weight:700;font-size:13.5px}
.kidchip.on{border-color:var(--navy);background:var(--navy-soft);color:var(--navy)}
.fld{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink)}
.lbl{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin:12px 0 4px}
.iconpick{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.iconpick button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:22px}
.iconpick button.on{border-color:var(--navy);background:var(--navy-soft)}
.accrow{display:flex;align-items:center;gap:9px;font-size:13.5px;border-bottom:1px solid var(--line-soft);padding:8px 0}
.accrow:last-child{border-bottom:none}
.accrow b{margin-left:auto}
.accrow.on{color:var(--navy);font-weight:700}
@keyframes popin{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.confetti i{position:absolute;top:-16px;width:9px;height:13px;border-radius:2px;opacity:.95;animation:fall linear forwards}
@keyframes fall{0%{transform:translateY(-20px) rotate(0deg)}100%{transform:translateY(104vh) rotate(720deg)}}
.perfect-banner{font-family:"Yusei Magic",sans-serif;text-align:center;font-size:25px;color:#8A6410;
  background:linear-gradient(135deg,#FDF6E8,#FBEDC6);border:2px solid #EBD8AE;border-radius:14px;padding:13px;margin-top:10px;animation:popin .6s ease}
.perfect-banner small{display:block;font-size:12.5px;color:#8A6410;font-family:"Zen Kaku Gothic New",sans-serif;font-weight:500;margin-top:3px}
.hatch-banner{font-family:"Yusei Magic",sans-serif;text-align:center;font-size:22px;color:#235B33;
  background:linear-gradient(135deg,#E7F5EC,#D5EFE0);border:2px solid var(--ok);border-radius:14px;padding:13px;margin-top:10px;animation:popin .6s ease}
.swatches{display:flex;gap:9px;flex-wrap:wrap;margin-top:8px}
.swatch{width:42px;height:42px;border-radius:50%;border:none;box-shadow:0 0 0 2px var(--line);font-size:0}
.swatch.on{box-shadow:0 0 0 3.5px var(--navy)}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.badge{border:1.5px solid var(--line);border-radius:12px;padding:9px 10px;font-size:12.5px;background:#fff;text-align:left;color:var(--ink3)}
.badge b{display:block;font-family:"Yusei Magic",sans-serif;font-size:13px;color:var(--ink)}
.badge.on{border-color:var(--gold);background:#FBF6EA;color:#8A6410}
.badge.on b{color:#8A6410}
.pop{animation:popin .5s ease}
@media(prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
<style>
/* ============================================================
 * Duolingo風 デザイン層 — ここで 上書きする（前の 指定より あとに 読む）
 * ========================================================== */
:root{
  --bg:#F7FBFF; --paper:#FFFFFF; --ink:#3C3C3C; --ink2:#7A7A7A; --ink3:#B0B0B0;
  --line:#E5E5E5; --line-soft:#F1F4F8;
  --navy:#1CB0F6; --navy-d:#1565A8; --navy-soft:#E4F4FF;
  --ok:#58CC02; --ok-d:#46A302; --ok-bg:#E7F8D8;
  --ng:#FF4B4B; --ng-d:#E04343; --ng-bg:#FFE2E2;
  --gold:#FFC800; --gold-d:#E5A800;
  --kazu:#1CB0F6; --katachi:#58CC02; --kotoba:#CE82FF; --kioku:#FF86D0; --shikou:#FF9600; --joshiki:#FF6B4A;
  --shadow:0 2px 0 rgba(0,0,0,.08);
  --r:16px;
}
body{background:var(--bg);background-image:none;font-family:"M PLUS Rounded 1c","Zen Kaku Gothic New","Hiragino Maru Gothic ProN",sans-serif;font-weight:500}
.appbar h1,.sec-title,.hero h2,.score b,.countdown,.verdict h3,.perfect-banner,.hatch-banner,.fb__t,.node__t,.xpbadge,.streakbadge{
  font-family:"M PLUS Rounded 1c","Yusei Magic",sans-serif;font-weight:800;letter-spacing:0}
.appbar{background:rgba(247,251,255,.97);border-bottom:2px solid var(--line);padding:9px 12px 8px;gap:7px;flex-wrap:wrap}
.appbar h1{font-size:16px;min-width:0}
.appbar h1 small{font-size:11px}

<script>
const ENG = (function () {
/**
 * おうち受験ラボ — パラメータ再抽選エンジン
 * ------------------------------------------------
 * 設計図JSON（problem template）から、実際に出題する問題を組み立てる。
 *  LLM呼び出しは一切行わない。すべて端末内の計算で完結する。
 *
 * 依存ゼロ。Node 22 / モダンブラウザのどちらでも動く（ESM）。
 *
 * 設計原則:
 *   1. 正解は「保存しない」。必ずスロットから計算し直す（誤りの混入を構造的に防ぐ）
 *   2. 乱数は seed で完全に再現できる（キャッシュ・同一日のメニュー固定・デバッグ）
 *   3. 数式は eval を使わず、自前の再帰下降パーサで評価する
 *   4. 検証に落ちた問題は絶対に返さない（validate を通ったものだけを出題）
 */

/* ============================================================
 * 1. 決定論的乱数（mulberry32）
 * ========================================================== */
function hashSeed(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619) >>> 0;
  }
  return h >>> 0;
}

function makeRng(seed) {
  let a = (typeof seed === 'number' ? seed : hashSeed(String(seed))) >>> 0;
  return function rng() {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ============================================================
 * 2. 安全な数式評価器（eval を使わない）
 * ============================================================
 * 対応: 数値リテラル / 識別子（ドットパス） / + - * / % / 括弧 /
 *       比較演算子 < <= > >= == !=  （制約式用）
 */
function tokenize(src) {
  const out = [];
  let i = 0;
  while (i < src.length) {
    const c = src[i];
    if (/\s/.test(c)) { i++; continue; }
    if (/[0-9]/.test(c)) {
      let j = i;
      while (j < src.length && /[0-9.]/.test(src[j])) j++;
      out.push({ t: 'num', v: Number(src.slice(i, j)) });
      i = j; continue;
    }
    if (/[A-Za-z_]/.test(c)) {
      let j = i;
      while (j < src.length && /[A-Za-z0-9_.]/.test(src[j])) j++;
      out.push({ t: 'id', v: src.slice(i, j) });
      i = j; continue;
    }
    const two = src.slice(i, i + 2);
    if (['<=', '>=', '==', '!='].includes(two)) { out.push({ t: 'op', v: two }); i += 2; continue; }
    if ('+-*/%()<>'.includes(c)) { out.push({ t: 'op', v: c }); i++; continue; }
    throw new Error('式に使えない文字: ' + c);
  }
  return out;
}

function evalExpr(src, vars = {}) {
  const tk = tokenize(String(src));
  let p = 0;
  const peek = () => tk[p];
  const eat = (v) => {
    const t = tk[p];
    if (!t || t.v !== v) throw new Error('式の構文エラー: ' + src);
    p++;
  };
  const resolve = (path) => {
    const parts = path.split('.');
    let cur = vars;
    for (const part of parts) {
      if (cur == null || typeof cur !== 'object' || !(part in cur)) {
        throw new Error('未定義の変数: ' + path);
      }
      cur = cur[part];
    }
    // オブジェクト（pick パッケージ）も「値」としてそのまま通す。
    // 算術に使えば NaN になるが、それは設計図側の誤りとして検証で落ちる。
    return cur;
  };

  function primary() {
    const t = peek();
    if (!t) throw new Error('式が途中で終わっています: ' + src);
    if (t.t === 'num') { p++; return t.v; }
    if (t.t === 'id') { p++; return resolve(t.v); }
    if (t.v === '(') { p++; const v = cmp(); eat(')'); return v; }
    if (t.v === '-') { p++; return -primary(); }
    if (t.v === '+') { p++; return primary(); }
    throw new Error('式の構文エラー: ' + src);
  }
  function mul() {
    let v = primary();
    while (peek() && ['*', '/', '%'].includes(peek().v)) {
      const op = tk[p++].v;
      const r = primary();
      v = op === '*' ? v * r : op === '/' ? v / r : v % r;
    }
    return v;
  }
  function add() {
    let v = mul();
    while (peek() && ['+', '-'].includes(peek().v)) {
      const op = tk[p++].v;
      const r = mul();
      v = op === '+' ? v + r : v - r;
    }
    return v;
  }
  function cmp() {
    const l = add();
    const t = peek();
    if (t && ['<', '<=', '>', '>=', '==', '!='].includes(t.v)) {
      p++;
      const r = add();
      switch (t.v) {
        case '<': return l < r;
        case '<=': return l <= r;
        case '>': return l > r;
        case '>=': return l >= r;
        case '==': return l === r;
        case '!=': return l !== r;
      }
    }
    return l;
  }
  const result = cmp();
  if (p !== tk.length) throw new Error('式の構文エラー（余り）: ' + src);
  return result;
}

/** 文字列中の ${式} を評価して埋め込む */
function interp(str, vars = {}) {
  if (typeof str !== 'string') return str;
  return str.replace(/\$\{([^}]*)\}/g, (_, expr) => {
    const v = evalExpr(expr.trim(), vars);
    return v == null ? '' : String(v);
  });
}

/** 値の同一性キー（オブジェクトは id で比較する） */
function keyOf(v) {
  if (v && typeof v === 'object') return v.id != null ? String(v.id) : JSON.stringify(v);
  return String(v);
}

/** 値の表示ラベル */
function labelOf(v) {
  if (v && typeof v === 'object') return v.kana ?? v.label ?? v.id ?? '';
  return String(v);
}

/* ============================================================
 * 3. スロット解決
 * ========================================================== */
function resolveSlot(slot, vars, rng) {
  switch (slot.kind) {
    case 'int': {
      const step = slot.step ?? 1;
      const lo = slot.min, hi = slot.max;
      const n = Math.floor((hi - lo) / step) + 1;
      const idx = Math.floor(rng() * n);
      return lo + idx * step;
    }
    case 'pick': {
      if (!Array.isArray(slot.from) || slot.from.length === 0) {
        throw new Error('pick スロットの from が空です');
      }
      return slot.from[Math.floor(rng() * slot.from.length)];
    }
    case 'expr':
      return evalExpr(slot.expr, vars);
    default:
      throw new Error('未知のスロット種別: ' + slot.kind);
  }
}

function resolveSlots(template, rng) {
  const vars = {};
  const order = template.slotOrder || Object.keys(template.slots || {});
  for (const name of order) {
    vars[name] = resolveSlot(template.slots[name], vars, rng);
  }
  return vars;
}

function satisfies(constraints, vars) {
  if (!Array.isArray(constraints)) return true;
  for (const c of constraints) {
    let ok;
    try { ok = evalExpr(c, vars); } catch { ok = false; }
    if (!ok) return false;
  }
  return true;
}

/* ============================================================
 * 4. 選択肢の組み立て
 * ========================================================== */
/** 選択肢の値解決: オブジェクトはそのまま / ${式} は補間 / 裸の識別子は式評価 / それ以外は文字列リテラル */
function resolveChoiceValue(item, vars) {
  if (typeof item !== 'string') return item;
  if (item.includes('${')) return interp(item, vars);
  try { return evalExpr(item, vars); } catch { return item; }
}

function buildChoices(spec, vars, rng) {
  const answer = evalExpr(spec.answer.expr, vars);
  const ak = keyOf(answer);
  let raw = [];

  if (spec.choices.kind === 'nearby') {
    const spread = spec.choices.spread || [1, 2];
    const min = spec.choices.min ?? -Infinity;
    const max = spec.choices.max ?? Infinity;
    const want = (spec.choices.count || 3) - 1;
    const pool = [];
    for (const s of spread) {
      pool.push(answer + s, answer - s);
    }
    // 決定論的にシャッフルして先頭から採用
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    for (const v of pool) {
      if (raw.length >= want) break;
      if (!Number.isFinite(v) || v < min || v > max) continue;
      if (v === answer) continue;
      if (raw.some(x => keyOf(x) === keyOf(v))) continue;
      raw.push(v);
    }
    // 足りなければ連番で埋める
    let d = 1;
    while (raw.length < want && d < 50) {
      for (const v of [answer + d, answer - d]) {
        if (raw.length >= want) break;
        if (v < min || v > max || v === answer) continue;
        if (raw.some(x => keyOf(x) === keyOf(v))) continue;
        raw.push(v);
      }
      d++;
    }
  } else if (spec.choices.kind === 'pool') {
    const from = (spec.choices.from || []).map(item => resolveChoiceValue(item, vars));
    const want = (spec.choices.count || 3) - 1;
    const shuffled = from.slice().sort(() => rng() - 0.5);
    for (const v of shuffled) {
      if (raw.length >= want) break;
      if (keyOf(v) === ak) continue;
      if (raw.some(x => keyOf(x) === ak && false)) continue;
      if (raw.some(x => keyOf(x) === keyOf(v))) continue;
      raw.push(v);
    }
  } else if (spec.choices.kind === 'explicit') {
    // values は「正解を含む候補の全部」として書ける。
    // 正解と同値のものはダミーに使わない（重複選択肢を構造的に防ぐ）。
    const vals = (spec.choices.values || []).map(v => resolveChoiceValue(v, vars));
    const want = (spec.choices.count || 3) - 1;
    for (const v of vals) {
      if (raw.length >= want) break;
      if (keyOf(v) === ak) continue;
      if (raw.some(x => keyOf(x) === keyOf(v))) continue;
      raw.push(v);
    }
  } else {
    throw new Error('未知の選択肢種別: ' + spec.choices.kind);
  }

  // 不足分を補う（選択肢が足りない事故を防ぐ）
  let n = 1;
  while (raw.length < (spec.choices.count || 3) - 1 && n < 100) {
    const cand = Number.isFinite(Number(answer)) ? Number(answer) + n : answer + '・' + n;
    if (keyOf(cand) !== ak && !raw.some(x => keyOf(x) === keyOf(cand))) raw.push(cand);
    n++;
  }

  const all = [answer, ...raw.slice(0, (spec.choices.count || 3) - 1)];
  // 決定論的シャッフル（Fisher-Yates with rng）
  for (let i = all.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [all[i], all[j]] = [all[j], all[i]];
  }
  return {
    values: all,
    answer,
    answerIndex: all.findIndex(v => keyOf(v) === ak)
  };
}

/* ============================================================
 * 5. 描画スペックの解決（HTML断片を生成）
 * ========================================================== */
const SHAPES = {
  circle:   { kana: 'まる',   svg: '<circle cx="20" cy="20" r="13" fill="#EDF3FA" stroke="#5C6572" stroke-width="2"/>' },
  triangle: { kana: 'さんかく', svg: '<path d="M20 7l13 24H7z" fill="#EDF3FA" stroke="#5C6572" stroke-width="2"/>' },
  square:   { kana: 'しかく',  svg: '<rect x="7" y="7" width="26" height="26" rx="2" fill="#EDF3FA" stroke="#5C6572" stroke-width="2"/>' },
  star:     { kana: 'ほし',    svg: '<path d="M20 5l4.6 9.6 10.4 1.4-7.6 7.4 1.9 10.4L20 28.9 10.7 33.8l1.9-10.4L5 16l10.4-1.4z" fill="#EDF3FA" stroke="#5C6572" stroke-width="1.6"/>' }
};

const GLYPHS = {
  apple:    '<circle cx="20" cy="24" r="12" fill="#D24A32"/><path d="M20 12v-4" stroke="#7A4A22" stroke-width="2" stroke-linecap="round"/><path d="M20 10c4-4 8-2 8-2s-1 5-6 5z" fill="#3C8A52"/>',

    S.push('<ellipse cx="' + cx + '" cy="' + r1(cy + bodyRy + 9) + '" rx="' + r1(bodyRx * 0.85) + '" ry="6" fill="rgba(34,38,47,.10)"/>');
    S.push('<path d="M' + r1(cx + bodyRx * 0.92) + ' ' + r1(cy + 6) + ' q' + r1(tailL * 1.1) + ' ' + r1(-tailL * 0.85) + ' ' + r1(tailL * 1.25) + ' ' + r1(-tailL * 0.1) + '" fill="none" stroke="' + cw.tail + '" stroke-width="7" stroke-linecap="round"/>');
    S.push('<ellipse cx="' + r1(cx - bodyRx * 0.5) + '" cy="' + r1(cy + bodyRy * 0.9) + '" rx="11" ry="7" fill="' + cw.foot + '" stroke="' + cw.stroke + '" stroke-width="2.5"/>');
    S.push('<ellipse cx="' + r1(cx + bodyRx * 0.5) + '" cy="' + r1(cy + bodyRy * 0.9) + '" rx="11" ry="7" fill="' + cw.foot + '" stroke="' + cw.stroke + '" stroke-width="2.5"/>');
    S.push('<path d="M' + cx + ' ' + r1(headCY - headR - crestH) + ' l' + r1(crestH * 0.55) + ' ' + r1(crestH * 0.95) + ' h' + r1(-crestH * 1.1) + 'z" fill="' + cw.crest + '" stroke="' + cw.crest2 + '" stroke-width="2.4" stroke-linejoin="round"/>');
    S.push('<ellipse cx="' + cx + '" cy="' + r1(cy) + '" rx="' + r1(bodyRx) + '" ry="' + r1(bodyRy) + '" fill="' + cw.body + '" stroke="' + cw.stroke + '" stroke-width="3"/>');
    S.push('<ellipse cx="' + cx + '" cy="' + r1(cy + bodyRy * 0.25) + '" rx="' + r1(bodyRx * 0.5) + '" ry="' + r1(bodyRy * 0.45) + '" fill="' + cw.belly + '"/>');
    S.push('<circle cx="' + cx + '" cy="' + r1(headCY) + '" r="' + r1(headR) + '" fill="' + cw.head + '" stroke="' + cw.stroke + '" stroke-width="3"/>');
    var ex = headR * 0.42, ey = headCY - headR * 0.1;
    [cx - ex, cx + ex].forEach(function (pxx) {
      S.push('<circle cx="' + r1(pxx) + '" cy="' + r1(ey) + '" r="' + r1(eyeR + 1.6) + '" fill="#fff"/>');
      S.push('<circle cx="' + r1(pxx) + '" cy="' + r1(ey) + '" r="' + r1(eyeR) + '" fill="#22456E"/>');
      if (lvOf(cats.shikou) >= 3) S.push('<circle cx="' + r1(pxx - eyeR * 0.35) + '" cy="' + r1(ey - eyeR * 0.4) + '" r="' + r1(eyeR * 0.38) + '" fill="#fff"/>');
    });
    S.push('<circle cx="' + r1(cx - headR * 0.78) + '" cy="' + r1(headCY + headR * 0.35) + '" r="3.6" fill="#F7B9C4"/>');
    S.push('<circle cx="' + r1(cx + headR * 0.78) + '" cy="' + r1(headCY + headR * 0.35) + '" r="3.6" fill="#F7B9C4"/>');
    S.push('<path d="M' + r1(cx - mouthW) + ' ' + r1(headCY + headR * 0.44) + ' q' + r1(mouthW) + ' ' + r1(mouthW * 0.85) + ' ' + r1(mouthW * 2) + ' 0" fill="none" stroke="' + cw.mouth + '" stroke-width="2.4" stroke-linecap="round"/>');
    S.push(accSVG(accOf().id, cx, headCY, headR, bodyRy, cy));
    if (bal >= 3) S.push('<text x="' + cx + '" y="26" text-anchor="middle" font-size="20">✨</text>');
    S.push('</svg>');
    return S.join('');
  }

  /* いま みせる すがた: たまご か そだった きょうりゅう */
  function petSVG(opt) {
    var k = activeKid();
    if (k && !k.hatched) return eggSVG(opt);
    return dinoSVG(opt);
  }

  /* ---------- 紙吹雪 ---------- */
  function confetti(n) {
    try {
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      n = n || 70;
      var wrap = document.createElement('div');
      wrap.className = 'confetti';
      var cols = ['#F6C453', '#E8628C', '#5C8CB8', '#5FA97C', '#8A72B8', '#F0A340', '#69C7C7'];
      for (var i = 0; i < n; i++) {
        var d = document.createElement('i');
        d.style.left = Math.round(Math.random() * 100) + '%';
        d.style.background = cols[i % cols.length];
        d.style.animationDelay = (Math.random() * 0.5).toFixed(2) + 's';
        d.style.animationDuration = (1.8 + Math.random() * 1.4).toFixed(2) + 's';
        if (i % 3 === 0) d.style.borderRadius = '50%';
        wrap.appendChild(d);
      }
      document.body.appendChild(wrap);
      setTimeout(function () { if (wrap.parentNode) wrap.parentNode.removeChild(wrap); }, 3800);
    } catch (e) { /* 紙吹雪が 出せない環境でも 先へ すすむ */ }
  }

  /* ---------- セッション ---------- */
  var session = null;   // { mode, queue, idx, results, reads, category }
  var cur = null;       // 現在の問題
  var phase = 'ready';  // ready | memorize | answering | graded
  var answered = null;  // 選んだ番号
  var hideTimer = null, countTimer = null;
  var screen = 'home';  // home | question | result | records | parent

  /* 「きょうの メニュー」: 日付から 決まる（同じ日は 同じ メニュー） */
  var DAY_PLAN = [
    { cat: 'kazu', n: 2 },
    { cat: 'katachi', n: 1 },
    { cat: 'kotoba', n: 1 },
    { cat: 'mix', n: 1 }
  ];
  function todaySeed() { return ENG.hashSeed('ouchi-' + today()); }

  function buildQueue(plan, seed) {
    var out = [], used = [], ex = [], k = 0;
    var mixCats = ['kioku', 'shikou', 'joshiki'];
    plan.forEach(function (p, pi) {
      for (var i = 0; i < p.n; i++) {
        var cat = p.cat === 'mix' ? mixCats[(pi + i) % mixCats.length] : p.cat;
        var want = wantedDiff(cat, k, 5);
        var pr = pickAtDifficulty(cat, want, seed + k * 997, ex, used);
        if (pr) { out.push(pr); ex.push(pr.fingerprint); used.push(pr.templateId); }
        k++;
      }
    });
    return out;
  }

  function buildHonbanQueue(seed) {
    var out = [], used = [], ex = [], k = 0;
    var cats = HONBAN_CFG.order.slice(0, HONBAN_CFG.count);
    cats.forEach(function (cat) {
      var want = (diffId() === 'easy') ? 1 : (diffId() === 'hard' ? 3 : 2);   /* ほんばんは 真ん中から */
      var pr = pickAtDifficulty(cat, want, seed + k * 997, ex, used);
      if (pr) { out.push(pr); ex.push(pr.fingerprint); used.push(pr.templateId); }
      k++;
    });
    return out;
  }

  function startSession(mode, category) {
    stopSpeak();
    var m = mode || store.mode;
    var seed = todaySeed() + (category ? ENG.hashSeed(category) : 0);
    var q = (m === 'honban' && !category) ? buildHonbanQueue(seed)
            : buildQueue(category ? [{ cat: category, n: 5 }] : DAY_PLAN, seed);
    if (!q.length) { toast('問題を つくれませんでした'); return; }
    session = { mode: m, queue: q, idx: 0, results: [], reads: 0, category: category || null,
                committed: false, gain: 0, celebrated: false };
    screen = 'question';
    nextQuestion();
  }

  /* ほんばんの 記録は、最後まで やった ときだけ のこす（中断は のこさない） */
  function commitSession() {
    if (!session || session.committed) return;
    session.committed = true;
    if (session.mode === 'honban') {
      session.results.forEach(function (r) {
        store.history.push({ d: today(), tmpl: r.tmpl, cat: r.cat, ok: r.ok, skip: !!r.skip, mode: 'honban' });
      });
      if (store.history.length > 2000) store.history = store.history.slice(-2000);
      saveStore();
      return;
    }
    /* れんしゅう: れんぞく の ひ の ごほうび と きょうの ボーナス */
    session.newBadges = [];
    var k = activeKid();
    if (!k) return;
    if (!k.badges) k.badges = {};
    var st = streak();
    if (st > (k.best || 0)) k.best = st;
    STREAK_BADGES.forEach(function (bd) {
      if (st >= bd.d && !k.badges[bd.id]) {
        k.badges[bd.id] = today();
        store.pts = (store.pts || 0) + bd.bonus;
        session.newBadges.push(bd);
      }
    });
    if (k.lastDaily !== today()) { k.lastDaily = today(); store.pts = (store.pts || 0) + DAILY_BONUS; session.dailyBonus = DAILY_BONUS; }
    saveStore();
  }

  function nextQuestion() {
    clearTimers();
    if (!session) return;
    if (session.idx >= session.queue.length) { screen = 'result'; render(); return; }
    cur = session.queue[session.idx];
    answered = null;
    session.reads = 0;
    var hideMs = cur._spec && cur._spec.render ? cur._spec.render.hideAfterMs : 0;
    phase = hideMs ? 'memorize' : 'answering';
    screen = 'question';
    render();
    if (hideMs) startMemorize(hideMs);
    else if (session.mode === 'honban') {
      phase = 'think';
      render();
      setTimeout(function () {
        if (phase !== 'think') return;
        session.reads++;
        if (TTS_OK) speak(cur.prompt, function () { if (phase === 'think') startThink(); });
        else { paintReader(); startThink(); }
      }, 400);
    } else setTimeout(function () { if (phase === 'answering') autoRead(); }, 380);
  }

  function autoRead() {
    if (!cur) return;
    session.reads++;
    if (TTS_OK) speak(cur.prompt, paintReader);
    else { paintReader(); toast('この 環境では 音声が つかえません。文字で よみましょう。'); }
  }

  function startMemorize(ms) {
    var left = Math.ceil(ms / 1000);
    paintReader();
    countTimer = setInterval(function () {
      left--;
      var cd = document.getElementById('cd');
      if (cd) cd.textContent = String(Math.max(0, left));
      if (left <= 0) {
        clearInterval(countTimer); countTimer = null;
        phase = 'answering';
        render();
        setTimeout(function () { if (phase === 'answering') autoRead(); }, 300);
      }
    }, 1000);
  }
  /* よみあげの あとの「かんがえる じかん」 */
  function startThink() {
    var left = Math.ceil(HONBAN_CFG.thinkMs / 1000);
    var cd0 = document.getElementById('cd'); if (cd0) cd0.textContent = String(left);
    countTimer = setInterval(function () {
      left--;
      var cd = document.getElementById('cd');
      if (cd) cd.textContent = String(Math.max(0, left));
      if (left <= 0) { clearInterval(countTimer); countTimer = null; phase = 'answering'; render(); }
    }, 1000);
  }

  function clearTimers() {
    if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
    if (countTimer) { clearInterval(countTimer); countTimer = null; }
    stopSpeak();
  }

  /* 聞き返し（本番の作法: チケット + 保護者PIN） */
  function askReplay() {
    if (session.mode === 'honban') { toast('ほんばんは 1かいだけ です'); return; }
    session.reads++;
    if (TTS_OK) speak(cur.prompt, paintReader); else paintReader();
  }

  /* ---------- PINモーダル ---------- */
  var pinBuf = '', pinAfter = null;
  function openPin(after) {
    pinBuf = ''; pinAfter = after;
    var m = document.getElementById('modal');
    var need = store.pin ? '' : '<p class="muted" style="margin:6px 0 0">まだ PIN が 未設定です。かんたんな 4けたを 決めてください（おうちの 方が おぼえておく ばんごうです）。</p>';
    m.innerHTML =
      '<div class="sheet" id="sheet"><div class="sheet__box" role="dialog" aria-modal="true" aria-label="保護者の確認">' +
        '<h3>' + (store.pin ? 'おうちの かたの かくにん' : 'PINを きめます') + '</h3>' +
        '<p class="muted" style="margin:0">' + (store.pin ? 'おうちの かたが 操作して いますか。' : 'せってい と きろくの そうさを まもる ばんごうです。') + '</p>' +
        need +
        '<div class="pindots" id="pindots"><i></i><i></i><i></i><i></i></div>' +
        '<div class="pinpad" id="pinpad"></div>' +
        '<button class="btn quiet small" id="pinCancel" style="margin-top:10px">やめる</button>' +
      '</div></div>';
    var pad = document.getElementById('pinpad');
    for (var n = 1; n <= 9; n++) pad.appendChild(pinKey(String(n)));
    pad.appendChild(pinKey('けす', true));
    pad.appendChild(pinKey('0'));
    pad.appendChild(pinKey('OK', true, true));
    document.getElementById('pinCancel').onclick = closeModal;
    document.getElementById('sheet').addEventListener('click', function (e) { if (e.target.id === 'sheet') closeModal(); });
    document.getElementById('pinpad').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      var v = b.getAttribute('data-v');
      if (v === 'けす') { pinBuf = pinBuf.slice(0, -1); paintPins(); return; }
      if (v === 'OK') { submitPin(); return; }
      if (pinBuf.length < 4) { pinBuf += v; paintPins(); }
      if (pinBuf.length === 4 && !store.pin) submitPin();
    });
    paintPins();
  }
  function pinKey(label, wide, ok) {
    var b = document.createElement('button');
    b.setAttribute('data-v', label);
    if (wide) b.className = 'wide';
    if (ok) b.style.background = 'var(--navy)', b.style.color = '#fff', b.style.borderColor = 'var(--navy)';
    b.textContent = label;
    return b;
  }
  function paintPins() {
    var d = document.getElementById('pindots'); if (!d) return;
    Array.prototype.forEach.call(d.children, function (el, i) { el.className = i < pinBuf.length ? 'on' : ''; });
  }
  function submitPin() {
    if (pinBuf.length !== 4) { toast('4けた いれてください'); return; }
    if (!store.pin) {
      store.pin = pinBuf; saveStore();
      toast('PINを とうろくしました');
      var after = pinAfter; closeModal(); if (after) after();
      return;
    }
    if (pinBuf === store.pin) {
      var a = pinAfter; closeModal(); if (a) a();
    } else { toast('PINが ちがいます'); pinBuf = ''; paintPins(); }
  }
  function closeModal() { document.getElementById('modal').innerHTML = ''; pinAfter = null; }

  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.className = 'toast on';
    setTimeout(function () { t.className = 'toast'; }, 2200);
  }

  /* ---------- 画面 ---------- */
  var view = document.getElementById('view');
  var titleEl = document.getElementById('title');
  var subEl = document.getElementById('sub');
  var backEl = document.getElementById('back');
  var badgeEl = document.getElementById('modebadge');
  var doneBar = document.getElementById('done');
  var doneBtn = document.getElementById('doneBtn');

  function setChrome(t, s, showBack) {
    titleEl.innerHTML = esc(t) + '<small>' + esc(s) + '</small>';
    backEl.hidden = !showBack;
    badgeEl.textContent = (session && session.mode === 'honban') || (!session && store.mode === 'honban') ? 'ほんばん' : 'れんしゅう';
    badgeEl.className = 'modebadge' + (((session && session.mode === 'honban') || (!session && store.mode === 'honban')) ? ' honban' : '');
    var xb = document.getElementById('xpbadge');
    var sbk = document.getElementById('streakbadge');
    if (xb) { xb.textContent = '⭐ ' + (store.pts || 0); xb.style.display = (screen === 'home') ? 'none' : 'flex'; }
    if (sbk) { sbk.textContent = '🔥 ' + streak(); sbk.style.display = (screen === 'question' || screen === 'result') ? 'none' : 'flex'; }
  }

  function render() {
    if (speaking) stopSpeak();
    doneBar.hidden = true;
    if (screen === 'home') return viewHome();
    if (screen === 'question') return viewQuestion();
    if (screen === 'result') return viewResult();
    if (screen === 'grow') return viewGrow();
    if (screen === 'records') return viewRecords();
    if (screen === 'parent') return viewParent();
  }

  /* ===== ホーム（レッスンパス） ===== */
  function nextBadgeHTML() {
    var k = activeKid(); if (!k) return '';
    var st = streak(), earned = k.badges || {}, nx = null;
    for (var i = 0; i < STREAK_BADGES.length; i++) { if (!earned[STREAK_BADGES[i].id]) { nx = STREAK_BADGES[i]; break; } }
    if (!nx) return '<div class="tiny" style="margin-top:6px">バッジは ぜんぶ とったよ！ すごい！</div>';
    return '<div class="tiny" style="margin-top:6px">つぎの バッジ「' + nx.name + '」まで あと ' + Math.max(0, nx.d - st) + 'にち（+' + nx.bonus + 'pt）</div>';
  }
  function senseiMessage() {
    var k = activeKid();
    if (k && !k.hatched) {
      var left = Math.max(0, HATCH_PT - (store.pts || 0));
      return left <= 0 ? 'もうすぐ うまれるよ！'
        : ('たまごが うまれるまで あと <b>' + left + 'pt</b>。もんだいを やると ポイントが たまるよ。');
    }
    var tRows = store.history.filter(function (h) { return h.d === today(); });
    var bal = balanceLv();
    if (!tRows.length) return 'きょうは <b>5問</b> だよ。ぜんぶ できると 音が なるよ。いっしょに やってみよう！';
    var low = [];
    GROW.forEach(function (g) { if (lvOf(store.cats[g.cat]) === bal) low.push(CATS[g.cat].name); });
    if (bal < 5 && low.length && low.length <= 3) {
      return 'いま <b>' + low.join('・') + '</b> が のびざんまい。ここを やると からだの バランスが よくなるよ！';
    }
    return 'きょうも よく がんばったね！ とっても いい ちょうし！';
  }
  function catLevel(c) { return lvOf(store.cats[c] || 0); }
  function starStr(lv) {

  }
  /* きょうかの アイコン（SVGで 描く。絵文字は 端末の フォントで 見えかたが かわるため つかわない） */

  function viewHome() {

    setChrome('おうち受験ラボ', k.name + 'の ラボ', false);
    var todayRows = store.history.filter(function (h) { return h.d === today(); });
    var todayOk = todayRows.filter(function (h) { return h.ok; }).length;
    var st = streak();
    var total = DAY_PLAN.reduce(function (a, p) { return a + p.n; }, 0);
    var doneToday = todayRows.length >= total;
    var nodes = CAT_ORDER.map(function (c, i) {
      var lv = catLevel(c), s30 = statsFor(c, 30);
      return '<div class="nodewrap">' +
        '<button class="node' + (lv > 0 ? ' done' : '') + '" data-act="start-cat" data-cat="' + c + '" aria-label="' + CATS[c].name + '">' +
          catIconSVG(c, 38) + '</button>' +
        '<span class="node__t">' + CATS[c].name + ' ・ ' + (s30.n ? s30.rate + '%' : 'まだ') + '</span>' +
        '<span class="stars">' + starStr(lv) + '</span>' +
      '</div>';
    }).join('');
    view.innerHTML =
      '<div class="heropanel">' +
        '<div style="display:flex;align-items:center;gap:10px">' +
          '<span style="font-size:34px">' + esc(k.icon) + '</span>' +
          '<div style="flex:1 1 auto;min-width:0">' +
            '<h2>' + (doneToday ? 'きょうは おわり！' : 'きょうの レッスン') + '</h2>' +
            '<p>' + esc(k.name) + '（' + esc(k.grade) + '）・ むずかしさ ' + diffName() + '</p>' +
          '</div>' +
          '<span style="font-size:30px">' + (doneToday ? '🏅' : '💪') + '</span>' +
        '</div>' +
        '<div style="display:flex;gap:10px;margin-top:14px">' +
          '<div class="stat" style="flex:1"><b>' + todayRows.length + '</b><span>きょう と いた</span></div>' +
          '<div class="stat" style="flex:1"><b>' + todayOk + '</b><span>せいかい</span></div>' +
          '<div class="stat" style="flex:1"><b>' + st + '</b><span>れんぞく の ひ</span></div>' +
        '</div>' +
        '<button class="btn big" data-act="start-day" style="margin-top:14px;background:#fff;color:#2E7A02;box-shadow:0 4px 0 #D9E8C6">' +
          (doneToday ? 'もう いちど やる（' + total + '問）' : '▶ レッスンを はじめる（' + total + '問）') + '</button>' +
      '</div>' +
      '<div class="card" style="margin-top:12px">' +
        '<div class="charwrap">' +
          '<div class="charsvg">' + petSVG({ size: 112 }) + '</div>' +
          '<div style="flex:1 1 auto;min-width:0">' +
            '<div class="ptsrow"><span class="tiny">バランス</span><b>' + balanceLv() + ' / 5</b></div>' +
            (k.hatched ? '<div class="ptsrow"><span class="tiny">きせかえ</span><b>' + accOf().name + '</b></div>' : '') +
            (k.hatched
              ? '<div class="tiny" style="margin-top:6px">' + (balanceLv() >= 3 ? 'からだの バランスが いい かんじ！' : 'まだ かたより。ぜんぶの きょうかを やると かわるよ') + '</div>'
              : '<div class="tiny" style="margin-top:6px">たまごに ひびが はいってきたよ。あと <b>' + Math.max(0, HATCH_PT - (store.pts || 0)) + 'pt</b>！</div>') +
            nextBadgeHTML() +
          '</div>' +
        '</div>' +
        senseiRow(senseiMessage(), balanceLv() >= 3 ? 'happy' : 'normal') +
      '</div>' +
      '<div class="card"><h3 class="sec-title">きょうか の パス</h3>' +
        '<p class="tiny" style="margin:0 0 10px">まるを おすと、その きょうかだけ れんしゅう できます。</p>' +
        '<div class="path">' + nodes + '</div></div>' +
      '<div class="card"><h3 class="sec-title">きろく</h3>' +
        '<div class="ptsrow"><span class="tiny">もっている ポイント</span><b>' + (store.pts || 0) + ' pt</b></div>' +
        '<div class="ptsrow"><span class="tiny">のびた きょうか</span><b>' + GROW.filter(function (g) { return lvOf(store.cats[g.cat]) > 0; }).length + ' / 6</b></div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px">' +
          '<button class="btn quiet small" data-act="go-grow">そだてる</button>' +
          '<button class="btn quiet small" data-act="go-records">きろくを みる</button>' +
        '</div></div>' +
      (store.account ? '' :
        '<div class="card"><h3 class="sec-title">おうちの かたへ</h3>' +
        '<p class="muted" style="margin:0 0 10px">アカウントを つくると、きろくを ファイルに 書き出して ほかの 端末に ひきつげます。</p>' +
        '<button class="btn ghost small" data-act="go-parent">アカウントを つくる</button></div>');
  }
  /* ===== そだてる ===== */
  function lowNames(n) {
    var bal = balanceLv(), out = [];
    GROW.forEach(function (g) { if (lvOf(store.cats[g.cat]) === bal) out.push(CATS[g.cat].name); });
    return out.slice(0, n || 3).join('・');
  }
  function viewGrow() {
    setChrome('そだてる', 'がんばりが からだに なる', false);
    var k = activeKid() || { hatched: false, color: 0, badges: {} };
    var bal = balanceLv();
    var cw = cwOf(k);
    var bars = GROW.map(function (g) {
      var pts = store.cats[g.cat] || 0, lv = lvOf(pts);
      var col = CATS[g.cat].hex;
      return '<div class="growrow"><span class="bar__t" style="color:' + col + '">' + CATS[g.cat].name + '</span>' +
        '<span class="bar__track"><span class="bar__fill" style="width:' + Math.round(lv / 5 * 100) + '%;background:' + col + '"></span></span>' +
        '<span class="bar__v">' + g.part + '</span></div>';
    }).join('');
    var weak = weakCats(2);
    var next = null;
    for (var i = 0; i < ACC.length; i++) if ((store.pts || 0) < ACC[i].pt) { next = ACC[i]; break; }
    view.innerHTML =
      '<div class="card">' +
        '<div class="charwrap" style="justify-content:center">' + petSVG({ size: 168 }) + '</div>' +
        senseiRow(!k.hatched
            ? ('いまは たまご。うまれるまで あと <b>' + Math.max(0, HATCH_PT - (store.pts || 0)) + 'pt</b> だよ。')
            : (bal >= 3
              ? 'とても いい バランス！ この ちょうしで つづけよう！'
              : 'まだ <b>' + lowNames(3) + '</b> が のびざんまい。そこを やると からだが かわるよ！'),
          k.hatched && bal >= 3 ? 'happy' : 'think') +
      '</div>' +
      '<div class="card"><h3 class="sec-title">からだの いろ</h3>' +
        '<p class="muted" style="margin:0">すきな いろを えらべます（いま: <b>' + cw.name + '</b>）。</p>' +
        '<div class="swatches">' + COLORWAYS.map(function (c, i) {
          return '<button class="swatch' + (i === (k.color || 0) ? ' on' : '') + '" data-act="color" data-c="' + i + '" ' +
            'style="background:' + c.body + '" aria-label="' + c.name + '" title="' + c.name + '"></button>';
        }).join('') + '</div></div>' +
      '<div class="card"><h3 class="sec-title">からだの できぐあい</h3><div class="growbars">' + bars + '</div>' +
        '<p class="tiny" style="margin-top:10px">' +
          (k.hatched ? '正解した きょうかの ばしょが そだちます。かたよると からだも かたよります。'
                     : 'うまれると、ここが からだに あらわれます。いまも ためています。') + '</p></div>' +
      '<div class="card"><h3 class="sec-title">れんぞく の ごほうび</h3>' +
        '<p class="muted" style="margin:0 0 8px">つづけた ひの かずで バッジと ポイントが もらえます。' +
          '（いまの れんぞく: <b>' + streak() + 'にち</b>／さいちょう <b>' + (k.best || 0) + 'にち</b>）</p>' +
        '<div class="badges">' + STREAK_BADGES.map(function (bd) {
          var got = !!(k.badges && k.badges[bd.id]);
          return '<div class="badge' + (got ? ' on' : '') + '"><b>' + (got ? '🏅 ' : '') + bd.name + '</b>' +
            (got ? (bd.bonus + 'pt ゲット！') : (bd.d + 'にち つづけると +' + bd.bonus + 'pt')) + '</div>';
        }).join('') + '</div></div>' +
      '<div class="card"><h3 class="sec-title">きせかえ</h3>' +
        '<p class="muted" style="margin:0 0 6px">いま: <b>' + accOf().name + '</b>（' + (store.pts || 0) + 'pt）</p>' +
        (next ? '<p class="tiny">つぎは ' + next.pt + 'pt で 「' + next.name + '」 が もらえるよ。あと ' + (next.pt - (store.pts || 0)) + 'pt！</p>'
              : '<p class="tiny">きせかえは ぜんぶ そろったよ！</p>') +
        '<button class="btn quiet small" data-act="acc-list" style="margin-top:10px">きせかえを みる</button></div>' +
      '<div class="card"><h3 class="sec-title">にがてを のばす</h3>' +
        '<p class="muted" style="margin:0 0 10px">' +
          weak.map(function (w) { return CATS[w.g.cat].name + '（' + w.g.part + '）'; }).join('・') +
          ' が のびしろだよ。</p>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">' +
          weak.map(function (w) {
            return '<button class="btn small" data-act="start-cat" data-cat="' + w.g.cat + '" style="background:' + CATS[w.g.cat].hex + '">' +
              CATS[w.g.cat].name + 'を やる</button>';
          }).join('') +
        '</div></div>';
  }

  /* ===== 出題 ===== */
  function viewQuestion() {
    if (!cur) return;
    var cat = CATS[cur.category] || { name: cur.category, color: 'var(--navy)' };
    setChrome(cat.name, (session.mode === 'honban' ? 'ほんばん' : 'れんしゅう') + '・' + (session.idx + 1) + '問め', true);
    var stars = '';
    for (var d = 1; d <= 3; d++) stars += '<i>' + (d <= cur.difficulty ? '★' : '☆') + '</i>';

    var hideMs = cur._spec && cur._spec.render ? cur._spec.render.hideAfterMs : 0;
    var isHidden = (phase === 'answering' && hideMs) ? ' is-hidden' : '';
    var cover = '';
    if (session.mode === 'honban' && phase === 'think') {
      cover = '<div class="stage__cover"><div class="tiny">かんがえる じかん</div>' +
        '<div class="countdown" id="cd">' + Math.ceil(HONBAN_CFG.thinkMs / 1000) + '</div>' +
        '<div class="tiny">おとを おもいだしてね</div></div>';
    } else if (phase === 'memorize') {
      cover = '<div class="stage__cover"><div class="tiny">おぼえてね</div><div class="countdown" id="cd">' +
        Math.ceil(hideMs / 1000) + '</div><div class="tiny">この あと かくれます</div></div>';
    } else if (phase === 'answering' && hideMs) {
      cover = '<div class="stage__cover"><div style="font-size:26px">🌫️</div><div class="tiny">えは かくれました。おもいだしてね</div></div>';
    }

    var promptHTML;
    if (session.mode === 'honban') {
      promptHTML = '<div class="eyebrow">もんだいぶん</div>' +
        '<p class="prompt hidden-mode">♪ おとを きいて かんがえましょう</p>' +
        (TTS_OK ? '' :
          '<div class="verdict ng" style="margin-top:12px">' +
            '<div class="verdict__head"><span class="verdict__badge">!</span><h3>音声が つかえません</h3></div>' +
            '<p>この 環境では 音声合成が つかえないため、ほんばんの よみあげが できません。' +
            'おうちの かたが したの もんだいぶんを よんで あげてください。</p>' +
            '<details class="adultbox" open><summary>もんだいぶん（おうちの かた よう）</summary>' +
            '<p><b>' + esc(cur.prompt) + '</b></p></details>' +
          '</div>');
    } else {
      promptHTML = '<div class="eyebrow">もんだいぶん</div><p class="prompt">' + esc(cur.prompt) + '</p>';
    }

    var skipNow = (phase === 'graded' && answered === -1);
    var choicesHTML = '';
    if (phase === 'answering' || phase === 'graded') {
      var disabled = phase === 'graded' ? ' disabled' : '';
      choicesHTML = '<div class="choices" id="choices">' + cur.choices.map(function (c, i) {
        var cls = '';
        if (phase === 'graded') {
          if (i === cur.answerIndex) cls = ' is-ok';
          else if (i === answered) cls = ' is-ng';
        }
        var mark = 'ABC'.charAt(i);
        if (phase === 'graded') {
          if (i === cur.answerIndex) mark = '○';
          else if (i === answered) mark = '×';
        }
        var chip = (skipNow && i === cur.answerIndex)
          ? ' <b class="choice__ans">こたえ</b>' : '';
        return '<button class="choice' + cls + '" data-act="answer" data-i="' + i + '"' + disabled + '>' +
          '<span class="choice__mark">' + mark + '</span><span>' + esc(c) + chip + '</span></button>';
      }).join('') +
        (phase === 'answering' && session.mode === 'honban'
          ? '<button class="choice" data-act="skip"><span class="choice__mark">？</span><span>わからない</span></button>' : '') +
        '</div>';
    } else {
      choicesHTML = '<p class="muted" style="margin-top:14px">' +
        (session.mode === 'honban' ? 'おとを おもいだしてね。もうすぐ こたえられます。'
                                   : 'えを おぼえてから、こたえを えらびます。') + '</p>';
    }

    var verdict = '';
    if (phase === 'graded') {
      var ok = answered === cur.answerIndex;
      var skip = answered === -1;
      verdict =
        '<div class="verdict ' + (skip ? 'skip' : (ok ? 'ok' : 'ng')) + '">' +
          '<div class="verdict__head"><span class="verdict__badge">' + (skip ? '—' : (ok ? '○' : '×')) + '</span>' +
          '<h3>' + (skip ? 'こたえなくても だいじょうぶ' : (ok ? 'せいかい！' : 'おしい！')) + '</h3></div>' +
          (skip ? '<p>こたえは <b>' + esc(cur.choices[cur.answerIndex]) + '</b> でした。いっしょに かぞえて みよう。</p>' : '') +
          '<p>' + esc(cur.explain.child) + '</p>' +
          '<details class="adultbox"><summary>おうちの かたへ（つまずきの ポイント）</summary>' +
          '<p>' + esc(cur.explain.adult) + '</p></details>' +
        '</div>';
    }

    view.innerHTML =
      '<div class="prog"><span class="prog__track"><span class="prog__fill" style="width:' +
        Math.round(((session.idx + (phase === 'graded' ? 1 : 0)) / session.queue.length) * 100) + '%"></span></span>' +
        '<span class="prog__n">' + (session.idx + 1) + '/' + session.queue.length + '</span></div>' +
      '<div class="card">' +
        '<div class="qhead"><span class="chip" style="background:' + cat.color + ';color:#fff">' + cat.name + '</span>' +
          '<span class="diff">むずかしさ <i>' + stars + '</i></span></div>' +
        (session.mode !== 'honban'
          ? senseiRow(phaseHint(), phase === 'graded' ? (answered === cur.answerIndex ? 'happy' : 'think') : (phase === 'memorize' ? 'think' : 'normal'))
          : '') +
        readerHTML() +
        '<div class="stage' + isHidden + '"><div class="stage__art">' + cur.renderHTML + '</div>' + cover + '</div>' +
        promptHTML + choicesHTML +
      '</div>';

    var fb = document.getElementById('doneFb');
    if (phase === 'graded') {
      var gok = answered === cur.answerIndex, gskip = answered === -1;
      doneBar.hidden = false;
      doneBar.className = 'done' + (gskip ? ' skip' : (gok ? ' ok' : ' ng'));
      if (fb) fb.innerHTML = fbHTML(gok, gskip);
      doneBtn.textContent = (session.idx + 1 >= session.queue.length) ? 'けっかを みる' : 'つぎへ すすむ';
    } else {
      doneBar.hidden = true;
      if (fb) fb.innerHTML = '';
    }
    paintReader();
  }

  function fbHTML(ok, skip) {
    var q = cur;
    var title = skip ? 'こたえなくても だいじょうぶ' : (ok ? 'せいかい！' : 'おしい！');
    var badge = skip ? '—' : (ok ? '○' : '×');
    var gain = session.lastGain || 0;
    return '<div class="fb__scroll">' +
      '<div class="fb__head"><span class="fb__badge">' + badge + '</span>' +
        '<h3 class="fb__t">' + title + '</h3></div>' +
      (skip ? '<p class="fb__p">こたえは <b>' + esc(q.choices[q.answerIndex]) + '</b> でした。</p>' : '') +
      '<p class="fb__p">' + esc(q.explain.child) + '</p>' +
      (gain ? '<div class="fb__pts">＋' + gain + ' pt</div>' : '') +
      '<details class="fb__more"><summary>おうちの かたへ（つまずきの ポイント）</summary>' +
      '<p>' + esc(q.explain.adult) + '</p></details>' +
    '</div>';
  }

  function phaseHint() {
    if (phase === 'memorize') return 'えを よく みて おぼえてね！';
    if (phase === 'think') return 'おとを おもいだそう！';
    if (phase === 'graded') {
      if (answered === -1) return 'いっしょに かんがえよう。つぎは できるよ！';
      return answered === cur.answerIndex ? 'せいかい！ すごい！' : 'おしい！ つぎは できるよ！';
    }
    return 'えを よく みて、かんがえて みよう！';
  }

  function readerHTML() {
    var bits = '';
    for (var i = 0; i < 7; i++) bits += '<i></i>';
    var canPlay = phase === 'answering' && !speaking;
    var label, state;
    if (speaking) { label = 'よみあげ ちゅう'; state = 'きいてね'; }
    else if (phase === 'memorize') { label = 'よみあげ'; state = 'まず えを おぼえよう'; }
    else if (session.reads > 0) { label = 'よみあげ'; state = 'もういちど きく？'; }
    else { label = 'よみあげ'; state = 'タップして きく'; }
    var replay = (session.mode === 'honban')
      ? '<button class="reader__replay" disabled aria-label="ほんばんは 1かいだけ">もういちど<small>ほんばんは 1かいだけ</small></button>'
      : '<button class="reader__replay" data-act="replay" aria-label="もういちど きく">もういちど<small>なんどでも きける</small></button>';
    return '<div class="reader" id="reader">' +
      '<button class="reader__play" data-act="read" aria-label="よみあげる"' + (canPlay ? '' : ' disabled') + '>▶</button>' +
      '<div class="reader__body"><div class="reader__label">' + label + '</div>' +
        '<div class="reader__wave">' + bits + '</div>' +
        '<div class="reader__state">' + state + '</div></div>' +
      replay +
    '</div>';
  }

  function paintReader() {
    var r = document.getElementById('reader');
    if (!r) return;
    r.className = 'reader' + (speaking ? ' is-reading' : '');
    var st = r.querySelector('.reader__state');
    if (st && !speaking) {
      if (phase === 'memorize') st.textContent = 'まず えを おぼえよう';
      else if (session.reads > 0) st.textContent = 'もういちど きく？';
      else st.textContent = 'タップして きく';
    } else if (st && speaking) st.textContent = 'きいてね';
    var play = r.querySelector('.reader__play');
    if (play) play.disabled = !(phase === 'answering' && !speaking);
  }

  function answer(i) {
    if (phase !== 'answering') return;
    answered = i;
    phase = 'graded';
    var ok = i === cur.answerIndex;
    var skip = i < 0;
    var gain = addPoints(cur.category, ok, skip, cur.difficulty);
    session.gain = (session.gain || 0) + gain;
    session.lastGain = gain;
    session.results.push({ tmpl: cur.templateId, cat: cur.category, ok: ok, skip: skip });
    if (session.mode !== 'honban') {
      store.history.push({ d: today(), tmpl: cur.templateId, cat: cur.category, ok: ok, skip: skip, mode: session.mode });
      if (store.history.length > 2000) store.history = store.history.slice(-2000);
    }
    var kb = activeKid();                                  /* たまごが かえる しゅんかん */
    if (kb && !kb.hatched && (store.pts || 0) >= HATCH_PT) { kb.hatched = true; session.hatched = true; }
    saveStore();
    stopSpeak();
    if (ok) sfxOk(); else if (skip) sfxSkip(); else sfxNg();
    render();
    if (ok) toast('せいかい！ +' + gain + 'pt');
    else if (skip) toast('+' + gain + 'pt ・ つぎ がんばろう');
  }

  /* ===== 結果 ===== */
  function viewResult() {
    if (session.results.length >= session.queue.length) commitSession();
    var isHonban = session.mode === 'honban';
    setChrome('おわり', isHonban ? 'ほんばん の けっか' : 'きょうの せいか', false);
    var ok = session.results.filter(function (r) { return r.ok; }).length;
    var n = session.results.length;
    var perfect = (n > 0 && ok === n);
    var rows = session.results.map(function (r, i) {
      var c = CATS[r.cat] || { name: r.cat, hex: '#22456E' };
      return '<div class="hist__row"><span class="hist__dot" style="background:' + c.hex + '"></span>' +
        '<span>' + (i + 1) + '問め・' + c.name + '</span>' +
        '<span class="hist__v ' + (r.skip ? 'skip' : (r.ok ? 'ok' : 'ng')) + '">' + (r.skip ? '—' : (r.ok ? '○' : '×')) + '</span></div>';
    }).join('');
    var byCat = {};
    session.results.forEach(function (r) { if (r.ok) byCat[r.cat] = (byCat[r.cat] || 0) + 1; });
    var growRows = CAT_ORDER.filter(function (c) { return byCat[c]; }).map(function (c) {
      var g = GROW_BY[c];
      return '<div class="hist__row"><span class="hist__dot" style="background:' + CATS[c].hex + '"></span>' +
        '<span>' + CATS[c].name + ' の ' + g.part + '</span>' +
        '<span class="hist__v ok">+' + byCat[c] + ' そだった</span></div>';
    }).join('');
    var freshBadges = session.newBadges || [];
    if (!session.celebrated) {
      session.celebrated = true;
      if (session.hatched) { confetti(85); sfxPerfect(); praise('うまれたよ！ ' + kidName() + 'の たまごが かえったよ！'); }
      else if (perfect) { confetti(85); sfxPerfect(); praise(kidName() + '、ぜんもん せいかい！ すごい！'); }
      else if (freshBadges.length) { confetti(60); sfxPerfect(); praise('れんぞく ' + freshBadges[freshBadges.length - 1].d + 'にち！ すごいね！'); }
      else { sfxFinish(); praise('よく がんばったね。' + ok + 'もん できたよ。'); }
    }
    var rate = n ? Math.round(ok / n * 100) : 0;
    view.innerHTML =
      '<div class="clearp">' +
        '<div style="font-size:44px">' + (session.hatched ? '🐣' : (perfect ? '🏆' : '✨')) + '</div>' +
        '<h2>' + (session.hatched ? 'たまごが かえった！' : (perfect ? 'パーフェクト！' : 'レッスン クリア！')) + '</h2>' +
        '<p>' + esc(kidName()) + ' ・ ' + (isHonban ? 'ほんばん' : 'れんしゅう') + '</p>' +
        '<div class="clearcards">' +

      '<button class="btn" id="yes" style="background:var(--ng);margin-top:12px">けす</button>' +
      '<button class="btn quiet" id="no" style="margin-top:8px">やめる</button></div></div>';
    document.getElementById('no').onclick = closeModal;
    document.getElementById('yes').onclick = function () { store.account = null; saveStore(); closeModal(); toast('アカウントを けしました'); render(); };
  }
  function openKidNew() {
    var m = document.getElementById('modal');
    m.innerHTML = '<div class="sheet" id="sheet"><div class="sheet__box"><h3>お子さまを ふやす</h3>' +
      '<label class="lbl" for="kn">おなまえ</label><input class="fld" id="kn" type="text" />' +
      '<label class="lbl">アイコン</label>' + iconPickHTML() +
      '<button class="btn" id="kg" style="margin-top:14px">つくる</button>' +
      '<button class="btn quiet small" id="kno" style="margin-top:8px">やめる</button></div></div>';
    wireIconPick();
    document.getElementById('kno').onclick = closeModal;
    document.getElementById('sheet').addEventListener('click', function (e) { if (e.target.id === 'sheet') closeModal(); });
    document.getElementById('kg').onclick = function () {
      var nm = (document.getElementById('kn').value || '').trim();
      if (!nm) { toast('おなまえを いれてください'); return; }
      addKid(nm, pickedIcon(), '年長'); closeModal(); render(); toast('お子さまを ふやしました');
    };
  }
  function openKidDel() {
    var k = activeKid();
    var m = document.getElementById('modal');
    m.innerHTML = '<div class="sheet" id="sheet"><div class="sheet__box"><h3>' + esc(k ? k.name : '') + ' の きろくを けしますか</h3>' +
      '<p class="muted">この お子さまの きろく・ポイント・キャラクターが 消えます。もどせません。</p>' +
      '<button class="btn" id="yes" style="background:var(--ng);margin-top:12px">けす</button>' +
      '<button class="btn quiet" id="no" style="margin-top:8px">やめる</button></div></div>';
    document.getElementById('no').onclick = closeModal;
    document.getElementById('yes').onclick = function () {
      store.kids = store.kids.filter(function (x) { return x.id !== store.kid; });
      if (!store.kids.length) { store.kids = [normKid({})]; }
      store.kid = store.kids[0].id;
      var nk = activeKid();
      store.history = nk.hist; store.pts = nk.pts; store.cats = nk.cats;
      saveStore(); closeModal(); screen = 'parent'; render(); toast('けしました');
    };
  }
  function openAccList() {
    var cur = accOf().id;
    var m = document.getElementById('modal');
    m.innerHTML = '<div class="sheet" id="sheet"><div class="sheet__box"><h3>きせかえ</h3>' +
      '<p class="muted" style="margin:0 0 6px">ポイントが たまると、じどうで みにつきます。</p>' +
      ACC.map(function (x) {
        return '<div class="accrow' + (x.id === cur ? ' on' : '') + '"><span>' + x.name + '</span>' +
          '<b>' + (store.pts || 0) + ' / ' + x.pt + ' pt</b></div>';
      }).join('') +
      '<button class="btn quiet small" id="acNo" style="margin-top:12px">とじる</button></div></div>';
    document.getElementById('acNo').onclick = closeModal;
    document.getElementById('sheet').addEventListener('click', function (e) { if (e.target.id === 'sheet') closeModal(); });
  }

  /* ---------- データの 書き出し / 読みこみ ---------- */
  function exportData() {
    saveStore();
    var data = JSON.stringify(store, null, 1);
    try {
      var blob = new Blob([data], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a2 = document.createElement('a');
      a2.href = url; a2.download = 'ouchi-juken-' + today() + '.json';
      document.body.appendChild(a2); a2.click();
      setTimeout(function () { if (a2.parentNode) a2.parentNode.removeChild(a2); URL.revokeObjectURL(url); }, 600);
      toast('ファイルに 書き出しました');
    } catch (e) {
      try { window.navigator.clipboard.writeText(data); toast('クリップボードに コピーしました'); }
      catch (e2) { toast('この 環境では 書き出せません'); }
    }
  }
  function importData(file) {
    var r = new FileReader();
    r.onload = function () {
      try {
        var d = JSON.parse(String(r.result));
        var s2 = blankStore();
        s2.account = (d.account && typeof d.account === 'object') ? d.account : null;
        s2.pin = typeof d.pin === 'string' ? d.pin : null;
        s2.kids = Array.isArray(d.kids) ? d.kids.map(normKid) : [];
        s2.mode = d.mode === 'honban' ? 'honban' : 'renshu';
        s2.rate = typeof d.rate === 'number' ? d.rate : 1;
        s2.sound = d.sound === false ? false : true;
        s2.diff = DIFF_PLAN[d.diff] ? d.diff : (d.diff === 'auto' ? 'auto' : 'normal');
        if (!s2.kids.length) s2.kids = [normKid({ hist: Array.isArray(d.history) ? d.history : [] })];
        s2.kid = s2.kids[0].id;
        s2.history = s2.kids[0].hist; s2.pts = s2.kids[0].pts; s2.cats = s2.kids[0].cats;
        store = s2; saveStore(); render(); toast('きろくを 読みこみました');
      } catch (e) { toast('ファイルを 読めませんでした'); }
    };
    r.readAsText(file);
  }
  function openImport() {
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'application/json,.json';
    inp.onchange = function () { if (inp.files && inp.files[0]) importData(inp.files[0]); };
    inp.style.position = 'fixed'; inp.style.left = '-9999px';
    document.body.appendChild(inp);
    inp.click();
    setTimeout(function () { if (inp.parentNode) inp.parentNode.removeChild(inp); }, 30000);
  }

  /* ---------- 操作 ---------- */
  backEl.onclick = function () {
    if (screen === 'question') {
      if (session && session.mode === 'honban') {
        openGate(function () {
          session = null; stopSpeak(); screen = 'home'; render();
          toast('ほんばんを ちゅうししました（きろくは のこりません）');
        });
        return;
      }
      if (session && session.results.length) { screen = 'result'; render(); }
      else { stopSpeak(); session = null; screen = 'home'; render(); }
      return;
    }
    stopSpeak(); screen = 'home'; render();
  };
  doneBtn.onclick = function () {
    if (!session) return;
    if (session.idx + 1 >= session.queue.length) { screen = 'result'; render(); }
    else { session.idx++; nextQuestion(); }
  };
  view.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var act = b.getAttribute('data-act');
    if (act === 'start-day') { startSession(null, null); }
    else if (act === 'start-cat') { startSession(null, b.getAttribute('data-cat')); }
    else if (act === 'answer') { answer(Number(b.getAttribute('data-i'))); }
    else if (act === 'skip') { answer(-1); }
    else if (act === 'read') { if (phase === 'answering') { session.reads++; if (TTS_OK) speak(cur.prompt, paintReader); } }
    else if (act === 'replay') { askReplay(); }
    else if (act === 'go-home') { session = null; screen = 'home'; render(); }
    else if (act === 'go-records') { screen = 'records'; render(); }
    else if (act === 'go-grow') { screen = 'grow'; render(); }
    else if (act === 'go-parent') { screen = 'parent'; render(); }
    else if (act === 'color') {
      var kk = activeKid();
      if (kk) { kk.color = Number(b.getAttribute('data-c')); saveStore(); render(); sfxOk(); toast('いろを かえました'); }
    }
    else if (act === 'acc-list') { openAccList(); }
    else if (act === 'acc-new') { openAccNew(); }
    else if (act === 'acc-pw') { openGate(openAccPw); }
    else if (act === 'acc-out') { openGate(openAccDel); }
    else if (act === 'kid-new') { openKidNew(); }
    else if (act === 'kid-sw') { switchKid(b.getAttribute('data-id')); render(); toast('お子さまを かえました'); }
    else if (act === 'kid-del') { openGate(openKidDel); }
    else if (act === 'sound') { store.sound = !store.sound; saveStore(); render(); toast(store.sound ? '音を つけました' : '音を けしました'); if (store.sound) sfxOk(); }
    else if (act === 'mode') {
      var m = b.getAttribute('data-m');
      if (m === store.mode) return;
      if (m === 'honban') { openGate(function () { store.mode = 'honban'; saveStore(); render(); toast('ほんばんモードに しました'); }); }
      else { store.mode = m; saveStore(); render(); toast('れんしゅうモードに しました'); }
    }
    else if (act === 'rate') { store.rate = Number(b.getAttribute('data-r')); saveStore(); render(); }
    else if (act === 'diff') { store.diff = b.getAttribute('data-d'); saveStore(); render(); sfxOk(); toast('むずかしさを かえました'); }
    else if (act === 'setpin') { openPin(function () { toast('PINを とうろくしました'); }); }
    else if (act === 'export') { exportData(); }
    else if (act === 'import') { openImport(); }
    else if (act === 'clear') { openGate(openClear); }
  });

  function openClear() {
    var m = document.getElementById('modal');
    m.innerHTML = '<div class="sheet" id="sheet"><div class="sheet__box"><h3>きろくを けしますか</h3>' +
      '<p class="muted">この お子さまの きろくが すべて 消えます。もどせません。</p>' +
      '<button class="btn" id="yes" style="background:var(--ng);margin-top:12px">けす</button>' +
      '<button class="btn quiet" id="no" style="margin-top:8px">やめる</button></div></div>';
    document.getElementById('no').onclick = closeModal;
    document.getElementById('yes').onclick = function () {
      store.history = []; store.pts = 0; store.cats = {}; saveStore(); closeModal(); toast('きろくを けしました'); render();
    };
  }

  /* ---------- タブ ---------- */
  var TABS = [
    { id: 'home', label: 'ホーム', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg>' },
    { id: 'day', label: 'れんしゅう', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 5h16v11H4z"/><path d="M9 20h6M12 16v4"/></svg>' },
    { id: 'grow', label: 'そだてる', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 20s-7-4.4-7-9.4A4 4 0 0 1 12 8a4 4 0 0 1 7 2.6c0 5-7 9.4-7 9.4z"/></svg>' },
    { id: 'records', label: 'きろく', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 15v-4M12 15V8M16 15v-6"/></svg>' },
    { id: 'parent', label: 'おうちの方', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="9" cy="9" r="3"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><path d="M16 8h5M16 12h5"/></svg>' }
  ];
  var tabbar = document.querySelector('.tabbar__inner');
  tabbar.innerHTML = TABS.map(function (t) {
    return '<button class="tab" data-tab="' + t.id + '">' + t.icon + '<span>' + t.label + '</span></button>';
  }).join('');
  function paintTabs() {
    var active = screen === 'question' || screen === 'result' ? 'day' : screen;
    Array.prototype.forEach.call(tabbar.children, function (b) {
      b.className = 'tab' + (b.getAttribute('data-tab') === active ? ' on' : '');
    });
  }
  tabbar.addEventListener('click', function (e) {
    var b = e.target.closest('[data-tab]'); if (!b) return;
    var id = b.getAttribute('data-tab');
    if (id === 'day') { startSession(null, null); return; }
    stopSpeak(); session = null; screen = id; render();
  });

  /* ---------- 起動 ---------- */
  var _render = render;
  render = function () { _render(); paintTabs(); };
  render();

  /* 読み上げが 途中で 止まっても 画面が 固まらないように */
  window.addEventListener('beforeunload', stopSpeak);
})();
</script>
<script>
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () {}); });
}
</script>
</body>
</html>
